version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    labels: ['internal']
  - package-ecosystem: npm
    directories: ['/', '/ember-gridstack', '/test-app']
    schedule:
      interval: weekly
    ignore:
      # Ember type tooling does not support TypeScript 7 yet
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      npm:
        patterns: ['*']
    labels: ['internal']

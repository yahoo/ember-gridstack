name: Bug report
description: Report something that is not working as expected.
labels: [bug]
body:
  - type: input
    id: ember-gridstack-version
    attributes:
      label: ember-gridstack version
    validations:
      required: true
  - type: input
    id: ember-source-version
    attributes:
      label: ember-source version
    validations:
      required: true
  - type: input
    id: gridstack-version
    attributes:
      label: gridstack version
    validations:
      required: true
  - type: dropdown
    id: build-setup
    attributes:
      label: Build setup
      options:
        - Vite
        - Embroider (webpack)
        - Classic ember-cli + ember-auto-import
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction link
      description: A minimal repo or ember-twiddle/StackBlitz that shows the problem.
    validations:
      required: true

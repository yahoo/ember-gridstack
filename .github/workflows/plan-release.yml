name: Plan Release
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target: # This workflow has permissions on the repo, do NOT run code from PRs in this workflow. See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    types:
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: plan-release # only the latest one of these should ever be running
  cancel-in-progress: true

jobs:
  should-run-release-plan-prepare:
    name: Should we run release-plan prepare?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-prepare: ${{ steps.should-prepare.outputs.should-prepare }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: main
          persist-credentials: false
      - id: should-prepare
        # release-plan/actions/should-prepare-release v1.0.2, inlined: its nested actions are not SHA-pinned
        env:
          EVENT: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if git diff --name-only HEAD HEAD~1 | grep -qx ".release-plan.json"; then
            echo "should-prepare=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" || ( "$EVENT" == "pull_request_target" && "$MERGED" == "true" ) ]]; then
            echo "should-prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-prepare=false" >> "$GITHUB_OUTPUT"
          fi

  create-prepare-release-pr:
    name: Create Prepare Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: should-run-release-plan-prepare
    permissions:
      contents: write
      issues: read
      pull-requests: write
    if: needs.should-run-release-plan-prepare.outputs.should-prepare == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run release-plan prepare
        # release-plan/actions/prepare v1.0.2, inlined: its nested actions are not SHA-pinned
        id: explanation
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          range=$(jq -r '.devDependencies["release-plan"]' package.json)
          version=$(npm view "release-plan@$range" version --json | jq -r 'if type == "array" then .[-1] else . end')
          npm install -g "release-plan@$version"
          if ! release-plan prepare 2> >(tee release-plan-stderr.txt >&2); then
            echo "::error::release-plan prepare failed"
            exit 1
          fi
          rm release-plan-stderr.txt
          versions=$(jq -r '[.solution[] | select(.newVersion) | .newVersion]' .release-plan.json)
          echo "has-release=$(jq 'length > 0' <<< "$versions")" >> "$GITHUB_OUTPUT"
          if [ "$(jq length <<< "$versions")" -eq 1 ]; then
            echo "new-version=v$(jq -r '.[0]' <<< "$versions")" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'text<<EOF'
            jq -r .description .release-plan.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        name: Create Prepare Release PR
        # internal/documentation-only changes bump nothing; they roll into the next release's notes
        if: steps.explanation.outputs.has-release == 'true'
        with:
          commit-message: "Prepare Release ${{ steps.explanation.outputs.new-version}} using 'release-plan'"
          labels: 'internal'
          sign-commits: true
          branch: release-preview
          title: Prepare Release ${{ steps.explanation.outputs.new-version }}
          body: |
            What merging this does:

            1. Stages the new version on npm (not public yet).
            2. Needs a maintainer to approve it on npmjs.com (Staged Packages, 2FA) or with `npm stage approve <id>`.
            3. Approved within an hour, the running Publish workflow then creates the git tag and GitHub release automatically.
            4. Approved later? Run Publish from the Actions tab (Run workflow). A rejected stage needs a new Prepare Release PR.

            Full flow: [RELEASE.md](https://github.com/yahoo/ember-gridstack/blob/main/RELEASE.md)

            To change the release channel (alpha, beta, rc, stable), run `pnpm release:channel <channel>` in a separate PR (see [RELEASE.md](https://github.com/yahoo/ember-gridstack/blob/main/RELEASE.md#channels)).

            -----------------------------------------

            ${{ steps.explanation.outputs.text }}

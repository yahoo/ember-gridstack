# For every push to the primary branch with .release-plan.json modified,
# runs release-plan.

name: Publish Stable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release-plan.json'

permissions: {}

concurrency:
  group: publish-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 'NPM Publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # release-plan creates the tag and GitHub release through the API, so no git credentials are needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # Drop --github-prerelease together with the release-plan block in ember-gridstack/package.json for 6.0.0.
      - name: Publish to npm
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm exec release-plan publish --provenance --github-prerelease

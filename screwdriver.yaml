cache:
  pipeline: [~/.pnpm-store]

shared:
  image: node:22
  environment:
    JOBS: 2

jobs:
  main:
    annotations:
      screwdriver.cd/ram: TURBO
      screwdriver.cd/cpu: TURBO
    steps:
      - install-chrome: ./build-scripts/setup-chrome.sh
      - install-pnpm: npm i -g pnpm@10.34.9
      - pnpm-store: pnpm config set store-dir ~/.pnpm-store
      - install: pnpm install --frozen-lockfile
      - lint: pnpm lint
      - test: pnpm test:ember
    requires:
      - ~pr
      - ~commit
      - ~commit:/^alpha$/

  # @embroider/try scenarios from test-app/.try.mjs; all must pass before publish
  try-ember-lts-4.12: &try
    annotations:
      screwdriver.cd/ram: TURBO
      screwdriver.cd/cpu: TURBO
    requires: main
    steps:
      - install-chrome: ./build-scripts/setup-chrome.sh
      - install-pnpm: npm i -g pnpm@10.34.9
      - pnpm-store: pnpm config set store-dir ~/.pnpm-store
      - install: pnpm install --frozen-lockfile
      - test: pnpm test:try "$TRY_SCENARIO"
    environment: { TRY_SCENARIO: ember-lts-4.12 }
  try-ember-lts-5.12:
    <<: *try
    environment: { TRY_SCENARIO: ember-lts-5.12 }
  try-ember-lts-6.12:
    <<: *try
    environment: { TRY_SCENARIO: ember-lts-6.12 }
  try-ember-release:
    <<: *try
    environment: { TRY_SCENARIO: ember-release }
  try-ember-beta:
    <<: *try
    environment: { TRY_SCENARIO: ember-beta }
  try-embroider-safe:
    <<: *try
    environment: { TRY_SCENARIO: embroider-safe }
  try-embroider-optimized:
    <<: *try
    environment: { TRY_SCENARIO: embroider-optimized }

  publish:
    requires:
      - main
      - try-ember-lts-4.12
      - try-ember-lts-5.12
      - try-ember-lts-6.12
      - try-ember-release
      - try-ember-beta
      - try-embroider-safe
      - try-embroider-optimized
    steps:
      - install-pnpm: npm i -g pnpm@10.34.9
      - pnpm-store: pnpm config set store-dir ~/.pnpm-store
      - install: pnpm install --frozen-lockfile
      - setup-ci: git clone https://github.com/screwdriver-cd/toolbox.git /tmp/ci
      - publish: |
          . /tmp/ci/git-ssh.sh
          pnpm exec semantic-release
    secrets:
      - NPM_TOKEN
      - GH_TOKEN
      - GIT_KEY_BASE64

  gh-pages:
    requires: publish
    steps:
      - deploy: |
          case "$GIT_BRANCH" in
            */master) ;;
            *) echo "gh-pages deploys only from master (branch: $GIT_BRANCH)"; exit 0 ;;
          esac
          git clone https://github.com/screwdriver-cd/toolbox.git /tmp/ci
          npm i -g pnpm@10.34.9
          pnpm config set store-dir ~/.pnpm-store
          pnpm install --frozen-lockfile
          . /tmp/ci/git-ssh.sh
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          ./build-scripts/deploy-gh-pages.sh "Deploy gh-pages from $SD_BUILD_SHA"
          git push origin gh-pages:gh-pages
    secrets:
      - GIT_KEY_BASE64

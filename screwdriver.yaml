cache:
  pipeline: [~/.yarn]

shared:
  image: node:22

jobs:
  main:
    annotations:
      screwdriver.cd/ram: TURBO
      screwdriver.cd/cpu: TURBO
    steps:
      - install-chrome: ./build-scripts/setup-chrome.sh
      - yarn-cache: yarn config set cache-folder ~/.yarn
      - install: yarn install --frozen-lockfile
      - test: yarn test
    requires:
      - ~pr
      - ~commit
      - ~commit:/^alpha$/
    environment:
      JOBS: 2

  publish:
    requires: main
    steps:
      - yarn-cache: yarn config set cache-folder ~/.yarn
      - install: yarn install --frozen-lockfile
      - setup-ci: git clone https://github.com/screwdriver-cd/toolbox.git /tmp/ci
      - publish: |
          . /tmp/ci/git-ssh.sh
          yarn semantic-release
    secrets:
      - NPM_TOKEN
      - GH_TOKEN
      - GIT_KEY_BASE64

  gh-pages:
    requires: publish
    steps:
      - deploy: |
          case "$GIT_BRANCH" in
            */master) ;;
            *) echo "gh-pages deploys only from master (branch: $GIT_BRANCH)"; exit 0 ;;
          esac
          git clone https://github.com/screwdriver-cd/toolbox.git /tmp/ci
          yarn config set cache-folder ~/.yarn
          yarn install --frozen-lockfile
          npx ember github-pages:commit --message "Deploy gh-pages from $SD_BUILD_SHA"
          . /tmp/ci/git-ssh.sh
          git push origin gh-pages:gh-pages
    secrets:
      - GIT_KEY_BASE64
    environment:
      JOBS: 2

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ember-gridstack</title>
    <meta
      name="description"
      content="Ember components for gridstack.js: draggable, resizable dashboard layouts."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    {{content-for "head"}}

    <link integrity="" rel="stylesheet" href="/@embroider/virtual/vendor.css" />
    <link integrity="" rel="stylesheet" href="/@embroider/virtual/app.css" />

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script src="/@embroider/virtual/vendor.js"></script>
    <script type="module">
      import Application from "./app/app";
      import environment from "./app/config/environment";

      Application.create(environment.APP);
    </script>

    {{content-for "body-footer"}}
  </body>
</html>

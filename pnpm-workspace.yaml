packages:
  - 'ember-gridstack'
  - 'test-app'

# test-app injects ember-gridstack so the addon's ember-source peer resolves to test-app's copy
dedupeInjectedDeps: false
syncInjectedDepsAfterScripts:
  - build

# @glimmer/component 2 imports ember-source types without declaring the peer, so it
# would pick up the hoisted (scenario) ember-source when the addon builds declarations
packageExtensions:
  '@glimmer/component@2':
    peerDependencies:
      ember-source: '*'
